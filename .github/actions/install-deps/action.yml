# Installs the system packages the tests need in the node:trixie container: rsync, oxipng, zstd, and the shared
# libraries Chrome and Firefox load.
#
# Local actions are read from the workspace, so actions/checkout must run before this.

name: Install dependencies
description: Install the system packages for the tests and the browsers with apt

runs:
  using: composite
  steps:
  - name: Install dependencies
    shell: bash
    env:
      # Debian 13 has no oxipng package: use the release's .deb, the same as .devcontainer/Containerfile
      OXIPNG_URL: https://github.com/oxipng/oxipng/releases/download/v10.2.1/oxipng_10.2.1-1_amd64.deb
      OXIPNG_SHA256: 4c3e7440c3ebf94b0d5a67d3add25b9a40897c7f14678ecdb5db3c7b77ff816f
    run: |
      curl -fsSL -o /tmp/oxipng.deb "$OXIPNG_URL"
      echo "$OXIPNG_SHA256  /tmp/oxipng.deb" | sha256sum -c -

      packages=(
          /tmp/oxipng.deb
          rsync

          # without it, actions/cache falls back to gzip, which changes the cache version, so it would not find
          # the caches saved on the runner (which has zstd)
          zstd

          # for chrome in puppeteer
          libnspr4 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64
          libxkbcommon0 libasound2t64 libgbm1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2

          # for firefox in puppeteer
          libgtk-3-0t64
      )

      apt-get update && apt-get upgrade -y && apt-get install -y --no-install-recommends "${packages[@]}" \
      && rm -rf /var/lib/apt/lists/* /tmp/oxipng.deb
