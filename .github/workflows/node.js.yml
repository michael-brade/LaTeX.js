# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    # Ubuntu 23.10+ blocks unprivileged user namespaces via AppArmor, which Chrome's sandbox needs
    - name: Allow unprivileged user namespaces for Chrome's sandbox
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    # puppeteer's postinstall downloads Chrome and Firefox into ~/.cache/puppeteer unless they are already
    # there; restore them before npm ci (the browser versions are pinned by puppeteer's version in the lockfile)
    - name: Cache puppeteer browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/puppeteer
        key: ${{ runner.os }}-puppeteer-${{ hashFiles('package-lock.json') }}

    # check and build
    - run: npm ci
    - run: npm run typecheck
    - run: npm run build

    - name: Test with coverage
      run: npm run testc
    - name: Debug coverage location
      if: ${{ !cancelled() }}
      run: |
          pwd
          ls -la test
          find . -name index.html -path '*coverage*' -not -path './node_modules/*'
    - name: Upload coverage report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-node-${{ matrix.node-version }}
        path: |
          test/coverage/
          !test/coverage/tmp
        retention-days: 14
