# Type-checks and builds the library, runs the unit tests with coverage and the integration tests on the build, uploads
# the coverage to Qlty, and analyzes the code with SonarQube (including the coverage).
#
# Each job runs on a fresh runner, the build and the coverage report are passed on between runners.
# Only the upload and sonar jobs can request an OIDC token, and they run no project code.

name: Node.js CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]


permissions:
  contents: read

env:
  # see Node.js Release Schedule: https://nodejs.org/en/about/releases/
  NODE_VERSION: '24.22'
  # caches are immutable: with a fixed key, only the first build is saved and all later runs test only that
  BUILD_CACHE_KEY: build-${{ github.run_id }}

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest

    # container.image can't read env, but it can read needs: pass NODE_VERSION on to the jobs in the container
    # if build should also have container: with a node version, we could create a reusable workflow (workflow_call)
    # with a node-version input that could hold the whole container job
    outputs:
      node-version: ${{ env.NODE_VERSION }}

    steps:
    - uses: actions/checkout@v7

    # Node.js, "npm ci" and "npm run prepare"
    - uses: $/.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    - run: npm run typecheck
    - run: npm run build

    - name: Cache the build
      uses: actions/cache/save@v6
      with:
        # the tests use the build: dist/ and bin/, with source maps for the coverage
        key: ${{ env.BUILD_CACHE_KEY }}
        path: |
          dist/
          bin/


  # The tests run in the same image the devcontainer is using, not on the runner: the screenshots must
  # match pixel for pixel, and Firefox renders text with the system's FreeType, HarfBuzz, cairo, pixman,
  # and fontconfig (Chrome brings its own), so the screenshots taken in the devcontainer only match
  # those taken on a system with the same libraries.

  test:
    name: Test
    runs-on: ubuntu-latest

    needs: build

    # Runs all steps below directly inside the official Debian Trixie + Node container
    container: &node-container
      image: node:${{ needs.build.outputs.node-version }}-trixie

    steps:
    - uses: actions/checkout@v7

    - uses: $/.github/actions/install-deps

    - uses: $/.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    # Ubuntu 23.10+ blocks unprivileged user namespaces via AppArmor, which Chrome's sandbox needs
    # - name: Allow unprivileged user namespaces for Chrome's sandbox
    #   run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    # "puppeteer browsers install" below downloads Chrome and Firefox into ~/.cache/puppeteer unless they are already
    # there; restore them before that (the browser versions are pinned by puppeteer's version in the lockfile)
    - name: Cache puppeteer browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/puppeteer
        key: ${{ runner.os }}-puppeteer-${{ hashFiles('package-lock.json') }}

    # instead of puppeteer's postinstall; does nothing if the browsers are already in the cache
    - run: npx --no puppeteer browsers install

    - name: Restore the build
      uses: actions/cache/restore@v6
      with:
        key: ${{ env.BUILD_CACHE_KEY }}
        fail-on-cache-miss: true
        path: |
          dist/
          bin/

    - name: Test with coverage
      run: npm run testc


    # a failed screenshot test leaves the new screenshot (.new.png) and the difference (.diff.png), a failed html test
    # the actual html (test/html/)
    - name: Archive failed screenshots and html
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: failed-tests
        path: |
          test/screenshots/**/*.new.png
          test/screenshots/**/*.diff.png
          test/html/
        if-no-files-found: ignore
        retention-days: 14

    - name: Archive coverage report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: |
          test/coverage/
          !test/coverage/tmp
        retention-days: 14


  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest

    needs: build

    container: *node-container

    steps:
    - uses: actions/checkout@v7

    - uses: $/.github/actions/install-deps

    - uses: $/.github/actions/setup-node
      with:
        node-version: ${{ env.NODE_VERSION }}

    # see the test job
    # - name: Allow unprivileged user namespaces for Chrome's sandbox
    #   run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    # same key as in the test job, so download both browsers here as well: caches are immutable
    - name: Cache puppeteer browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/puppeteer
        key: ${{ runner.os }}-puppeteer-${{ hashFiles('package-lock.json') }}

    # see test job
    - run: npx --no puppeteer browsers install

    - name: Restore the build
      uses: actions/cache/restore@v6
      with:
        key: ${{ env.BUILD_CACHE_KEY }}
        fail-on-cache-miss: true
        path: |
          dist/
          bin/

    - name: Integration tests
      run: npm run test-int


  upload:
    name: Upload coverage to Qlty
    runs-on: ubuntu-latest

    needs: test

    # GitHub gives pull_request runs from forks neither an OIDC token nor secrets, so skip the upload there
    # TODO: fork PRs get no coverage in Qlty, only after merging
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      id-token: write   # secretless Qlty coverage upload with OIDC

    steps:
    # Qlty reads the commit from git and matches the paths in lcov.info against the files; nothing is run
    - uses: actions/checkout@v7

    - name: Download coverage report
      uses: actions/download-artifact@v4
      with:
        name: coverage
        path: test/coverage

    - name: Upload coverage to Qlty
      uses: qltysh/qlty-action/coverage@a46e29cfd54065ae8a2c6b1fd3446aed1b1a4257    # v2.8.0
      with:
        # authenticates with OIDC (id-token: write), no secret needed
        oidc: true
        files: test/coverage/lcov.info
        skip-errors: false


  sonar:
    name: Analyze with SonarQube
    runs-on: ubuntu-latest

    needs: test     # for the coverage report

    # fork PRs get no OIDC token
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      id-token: write   # secretless Sonar login with OIDC

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # disable shallow clones for a better relevancy of analysis

    - name: Download coverage report
      uses: actions/download-artifact@v4
      with:
        name: coverage
        path: test/coverage

    - name: Cache SonarQube packages
      uses: actions/cache@v6
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
      id: auth

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
      with:
        args: >
          -Dsonar.organization=michael-brade
          -Dsonar.projectKey=michael-brade_LaTeX.js

          -Dsonar.sources=.
          -Dsonar.exclusions=test/**,public/fonts/**

          -Dsonar.tests=test
          -Dsonar.coverage.exclusions=docs/**,lib/**,public/**,*.config.ts
          -Dsonar.javascript.lcov.reportPaths=test/coverage/lcov.info
